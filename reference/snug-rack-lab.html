<title>Snug Wrld Rack Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen showroom. Garment hangs centre stage, swing tags dangle off its hanger, type sits beneath. Single deliberate light look. */
:root{
  --paper:#ecebe6; --ink:#151513; --mute:#77756d; --line:#cfccc2; --brand:#14ef1c; --brand-ink:#6a1f78; --wood:#7a4a2a; --tint:#ecebe6;
  --display:"Archivo Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--tint);color:var(--ink);font-family:var(--body);overflow:hidden;transition:background-color .9s ease;-webkit-user-select:none;user-select:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:clamp(16px,3vw,40px)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.logo{height:44px;width:auto;display:block}
.close{justify-self:end;border:0;background:none;font-family:var(--body);font-size:12px;letter-spacing:.06em;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
.close span{font-size:13px;font-weight:600}
main{position:relative;display:grid;grid-template-rows:1fr auto;min-height:0}
.stage{position:relative;display:grid;place-items:center;min-height:0;perspective:1400px;touch-action:pan-y;cursor:grab}
.stage.dragging{cursor:grabbing}
.rig{position:relative;width:min(56vw,360px,50vh);aspect-ratio:4/5;transform-origin:50% -14%}
.neck{position:absolute;left:50%;top:var(--nt,-11.5%);width:var(--nw,27%);transform:translateX(-50%);pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 2px rgba(20,12,6,.25))}
.card{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px)}
.face.back{transform:rotateY(180deg) translateZ(1px)}
.face img,.face svg.dye{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0;pointer-events:none;-webkit-user-drag:none}
.face img{filter:drop-shadow(0 6px 8px rgba(20,20,18,.10))}
.shade{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:50% 0;mask-position:50% 0;opacity:0;pointer-events:none}
.hint{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.hint.gone{opacity:0}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;cursor:pointer;z-index:6;transition:background .2s,border-color .2s}
.arrow:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.arrow:focus-visible,.seg button:focus-visible,.close:focus-visible,.tag:focus-visible,.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.arrow.l{left:0}.arrow.r{right:0}
/* swing tags */
.tags{position:absolute;top:-3%;left:100%;display:flex;gap:6px;z-index:4;pointer-events:none}
.tagwrap{position:relative;transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite;pointer-events:none}
.tagwrap .string{width:1px;margin-inline:auto;background:var(--ink);opacity:.55}
.tag{pointer-events:auto;display:block;width:46px;padding:14px 0 8px;border:0;cursor:pointer;background:var(--c);color:var(--fgc);font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;writing-mode:vertical-rl;text-orientation:mixed;height:96px;clip-path:polygon(22% 0,78% 0,100% 12%,100% 100%,0 100%,0 12%);position:relative;box-shadow:0 6px 10px rgba(0,0,0,.12);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tag::before{content:"";position:absolute;top:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--tint);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tag:hover{transform:rotate(-7deg)}
.tagwrap.on .tag{transform:translateY(14px)}
.tagwrap.on .tag::after{content:"";position:absolute;inset:auto 6px 6px;height:2px;background:currentColor}
@keyframes sway{0%,100%{transform:rotate(2.2deg)}50%{transform:rotate(-2.2deg)}}
/* info */
.info{display:grid;justify-items:center;gap:7px;padding-block:4px 14px;text-align:center}
.count{font-size:9.5px;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
.sub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.sub:empty{display:none}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(17px,1.9vw,24px);line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);text-wrap:balance}
h1 em{font-style:normal;color:inherit}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:999px;padding:3px;width:150px}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--ink)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 0;font-family:var(--body);font-size:10px;letter-spacing:.14em;cursor:pointer;color:var(--ink);transition:color .2s}
.seg button.lit{color:var(--paper)}
.cta{margin-top:4px;font-size:10.5px;letter-spacing:.14em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
.cta:hover{opacity:.65}
footer{overflow:hidden;margin-inline:calc(50% - 50vw);background:var(--brand);padding-block:9px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);white-space:nowrap}
footer span{display:inline-block;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (max-width:640px){
  .tags{left:100%;top:4%;gap:3px;margin-left:4px}
  .tag{height:62px;width:22px;font-size:7px;padding:10px 0 4px}
  .tag::before{width:4px;height:4px;margin-left:-2px;top:3px}
  .arrow{top:auto;bottom:-6px;transform:none;width:38px;height:38px}
  .rig{width:min(58vw,300px,42vh)}
}
@media (prefers-reduced-motion:reduce){.tagwrap,footer span{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="walnut" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#bd7c4d"/><stop offset=".5" stop-color="#8a4f2b"/><stop offset="1" stop-color="#4a2512"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#ffe2c4" stop-opacity="0"/><stop offset=".5" stop-color="#ffe2c4" stop-opacity=".6"/><stop offset="1" stop-color="#ffe2c4" stop-opacity="0"/></linearGradient>
  <linearGradient id="chrome" x1="0" x2="1"><stop offset="0" stop-color="#6f706c"/><stop offset=".45" stop-color="#f4f4f0"/><stop offset=".6" stop-color="#b9bab5"/><stop offset="1" stop-color="#5c5d59"/></linearGradient>
</defs></svg>

function faceHTML(src){
  return `<img src="${src}" alt=""><div class="shade" style="-webkit-mask-image:url(${src});mask-image:url(${src})"></div>`;
}
function render(){
  const p=PRODUCTS[idx];
  const src=p.colours?p.colours[colour].img:p.front;
  frontEl.innerHTML=faceHTML(src);
  backEl.innerHTML=p.back?faceHTML(p.back):"";
  $("name").innerHTML=p.name;
  $("eyebrow").textContent=p.colours?p.colours[colour].label:"";
  $("count").textContent=`0${idx+1} / 0${PRODUCTS.length}`;
  const tags=$("tags");tags.innerHTML="";
  (p.colours||[]).forEach((c,i)=>{
    const w=document.createElement("div");w.className="tagwrap"+(i===colour?" on":"");
    w.style.animationDelay=(-i*1.1)+"s";
    w.innerHTML=`<div class="string" style="height:${34+i*22}px"></div><button class="tag" style="--c:${c.hex};--fgc:${c.fg}" aria-label="Colour ${c.label}">${c.label}</button>`;
    w.querySelector("button").onclick=()=>pickColour(i);
    tags.appendChild(w);
  });
  document.body.style.setProperty("--tint",p.colours?mix(p.colours[colour].hex):"#ecebe6");
  draw();
}
function mix(hex){ // 9% of the colourway into the paper
  const a=[0xec,0xeb,0xe6],b=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  return "rgb("+a.map((v,i)=>Math.round(v*.91+b[i]*.09)).join(",")+")";
}
function draw(){
  card.style.transform=`rotateY(${angle}deg)`;
  rig.style.transform=`rotateZ(${swing}deg)`;
  const s=Math.sin(angle*Math.PI/180);
  document.querySelectorAll(".shade").forEach(el=>{
    const dir=s>0?"to right":"to left";
    el.style.background=`linear-gradient(${dir},rgba(0,0,0,0) 15%,rgba(10,8,6,.75))`;
    el.style.opacity=Math.min(1,Math.abs(s)*1.1);
  });
  const norm=((angle%360)+360)%360, back=norm>90&&norm<270;
  const t=1-Math.abs(((norm/180)%2)-1); // 0 front .. 1 back
  $("knob").style.transform=`translateX(${t*100}%)`;
  $("bFront").classList.toggle("lit",!back);$("bBack").classList.toggle("lit",back);
}
// spring physics for angle + pendulum
function springTo(target,{onDone,kick=0,eps=0}={}){
  cancelAnimationFrame(anim);gen++;
  if(reduce){angle=target;swing=0;draw();onDone&&onDone();return}
  let v=0,sv=kick,last=performance.now();
  const step=now=>{
    const dt=Math.min(.032,(now-last)/1000);last=now;
    v+=((target-angle)*120-v*14)*dt; angle+=v*dt;
    sv+=((-swing)*90-sv*5+v*.02)*dt; swing+=sv*dt;
    draw();
    if(eps&&onDone&&Math.abs(target-angle)<eps){const f=onDone,me=gen;onDone=null;f();if(gen!==me)return}
    if(Math.abs(target-angle)<.05&&Math.abs(v)<.5&&Math.abs(swing)<.03&&Math.abs(sv)<.05){angle=target;swing=0;draw();onDone&&onDone();return}
    anim=requestAnimationFrame(step);
  };anim=requestAnimationFrame(step);
}
// drag to turn
let drag=null;
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")||busy)return;
  cancelAnimationFrame(anim);
  drag={x:e.clientX,a:angle,lastX:e.clientX,t:performance.now(),vel:0};
  stage.setPointerCapture(e.pointerId);stage.classList.add("dragging");
});
stage.addEventListener("pointermove",e=>{
  if(!drag)return;
  const now=performance.now(),dx=e.clientX-drag.x;
  drag.vel=(e.clientX-drag.lastX)/Math.max(1,now-drag.t);drag.lastX=e.clientX;drag.t=now;
  const p=PRODUCTS[idx];let a=drag.a+dx*.55;
  if(!p.back){const off=a-drag.a;a=drag.a+Math.sign(off)*Math.min(70,Math.abs(off)*.5)} // resist: no back to show
  angle=a;swing=Math.max(-6,Math.min(6,-drag.vel*4));draw();
});
const endDrag=()=>{
  if(!drag)return;stage.classList.remove("dragging");
  const p=PRODUCTS[idx];let target;
  if(!p.back)target=drag.a;
  else{const proj=angle+drag.vel*220;target=Math.round(proj/180)*180}
  drag=null;springTo(target,{kick:-angle*.02});
};
stage.addEventListener("pointerup",endDrag);stage.addEventListener("pointercancel",endDrag);
// toggle
function face(back){
  const p=PRODUCTS[idx];if(back&&!p.back){springTo(angle,{kick:5});return}
  const base=Math.round(angle/360)*360;springTo(base+(back?180:0),{kick:3});
}
$("bFront").onclick=()=>face(false);$("bBack").onclick=()=>face(true);
// switch piece: turn away to profile, swap, turn in
function go(d){
  if(busy)return;busy=true;
  const out=Math.round(angle/180)*180+(d>0?-90:90);
  springTo(out,{eps:6,onDone:()=>{
    idx=(idx+d+PRODUCTS.length)%PRODUCTS.length;colour=0;
    angle=d>0?90:-90;render();springTo(0,{kick:d*4,eps:4,onDone:()=>busy=false});
  }});
}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});

// dye-dip: new colourway wicks up from the hem behind a wavy edge
function pickColour(i){
  const p=PRODUCTS[idx];if(i===colour||busy)return;
  if(Math.abs(angle%360)>1){const base=Math.round(angle/360)*360;springTo(base)}
  const c=p.colours[i];colour=i;busy=true;
  document.querySelectorAll(".tagwrap").forEach((w,k)=>w.classList.toggle("on",k===i));
  $("eyebrow").textContent=c.label;
  document.body.style.setProperty("--tint",mix(c.hex));
  const finish=()=>{frontEl.innerHTML=faceHTML(c.img);busy=false;draw()};
  if(reduce){finish();return}
  const W=1000,H=1250,NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","dye");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("preserveAspectRatio","xMidYMin meet");
  const id="m"+Date.now();
  svg.innerHTML=`<defs><mask id="${id}"><path fill="#fff"/></mask></defs>
    <image href="${c.img}" width="${W}" height="${H}" preserveAspectRatio="xMidYMin meet" mask="url(#${id})"/>`;
  frontEl.insertBefore(svg,frontEl.querySelector(".shade"));
  const path=svg.querySelector("path");
  const fingers=[...Array(7)].map((_,k)=>({x:90+k*130+Math.random()*60,w:16+Math.random()*22,h:40+Math.random()*90,d:Math.random()*.25}));
  const t0=performance.now(),dur=1150;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const tick=now=>{
    const t=Math.min(1,(now-t0)/dur),e=ease(t),ph=now/180;
    const y0=H+60-(H+200)*e,amp=26*(1-e*.6);
    let d=`M0 ${H+10} L0 ${y0}`;
    for(let x=0;x<=W;x+=25){d+=` L${x} ${(y0+Math.sin(x/90+ph)*amp+Math.sin(x/37-ph*1.3)*amp*.35).toFixed(1)}`}
    d+=` L${W} ${H+10}Z`;
    fingers.forEach(f=>{const g=Math.max(0,Math.min(1,(e-f.d)*3))*(1-e)*1.4;if(g<=0)return;
      const top=y0-f.h*g,r=f.w/2;
      d+=` M${f.x-r} ${y0+20} L${f.x-r} ${top+r} A${r} ${r} 0 0 1 ${f.x+r} ${top+r} L${f.x+r} ${y0+20}Z`});
    path.setAttribute("d",d);
    if(t<1)requestAnimationFrame(tick);else finish();
  };requestAnimationFrame(tick);
  if(Math.abs(angle%360)<=1)springTo(angle,{kick:2.5});
}

$("logo").src=LOGO;
render();
// first-visit nudge: a small turn shows the piece can be moved
setTimeout(()=>{if(!drag&&!reduce&&!busy){springTo(38,{onDone:()=>springTo(0)})}},900);
</script>
